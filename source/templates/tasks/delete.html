{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <a class="btn btn-outline-secondary btn-sm mb-3" href="{% url 'projects_detail' task.project_id %}">К проекту</a>
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Удалить задачу</h1>
                <p class="text-break">Вы точно хотите удалить задачу «{{ task.summary }}»?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex flex-wrap gap-2 border-top pt-3 mt-3">
                        <button class="btn btn-danger btn-sm" type="submit">Удалить задачу</button>
                        <a class="btn btn-outline-secondary btn-sm" href="{% url 'tasks_detail' task.pk %}">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
