{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <a class="btn btn-outline-secondary btn-sm mb-3" href="{% url 'issue_tracker:tasks_detail' task.pk %}">Назад</a>
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Редактировать задачу</h1>
                <p class="text-break">Проект: <a href="{% url 'issue_tracker:projects_detail' task.project_id %}">{{ task.project.name }}</a></p>
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="d-flex flex-wrap gap-2 border-top pt-3 mt-3">
                        {% if request.user.is_authenticated %}
                        <button class="btn btn-primary btn-sm" type="submit">Сохранить</button>
                        {% endif %}
                        <a class="btn btn-outline-secondary btn-sm" href="{% url 'issue_tracker:tasks_detail' task.pk %}">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
