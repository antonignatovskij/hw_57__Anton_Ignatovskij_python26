{% load django_bootstrap5 %}
<form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <div class="d-flex flex-wrap gap-2 border-top pt-3 mt-3">
        <button class="btn btn-primary btn-sm" type="submit">Сохранить</button>
        {% if project %}
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'projects_detail' project.pk %}">Отмена</a>
        {% else %}
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'projects_list' %}">Отмена</a>
        {% endif %}
    </div>
</form>
